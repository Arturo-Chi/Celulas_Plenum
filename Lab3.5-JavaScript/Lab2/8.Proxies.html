    <h1>Proxies</h1>
    <script>
        /*Es un tema que va de la mano con la orientación a objetos: Los Proxies

        Son un mecanismo que permiten crear objetos basado en un objeto literal inicial.
        Como cuando se generan instancias de una clase en la POO, con la diferencia de que es a partir de un objeto literal


        Se ve el uso de un manejador (handler).
        */

        const persona = {
            nombre:"",
            apellido:"",
            edad:0
        } //-> Objeto Base, del que vamos a generar más personas

        const manejador = {
            set(obj, prop, valor){ //-> Siempre va en los manejadores
                 //Validación de propiedad que no se encuentra dentro del molde:
                if(Object.keys(obj).indexOf(prop) === -1){
                    return console.error(`La propiedad ${prop} no existe en el molde Persona`)                    
                }

                if(
                ((prop === "nombre" || prop === "apellido") && 
                !(/^[A-Za-zÑñÁáÉéÍíÓóÚú\s]+/g.test(valor))) || typeof value !=="string"
                )
                {
                    return console.error("La propiedad solo acepta letras y espacios en blanco")
                }

                obj[prop] = valor; //-> Esta linea hace que se asignen los valores en cada atributo del objeto

            }
        } //--Mandejador con el trabajaremos las validaciones


        const comstock = new Proxy(persona, manejador);

        //comstock.nombre = "nooker";
        //comstock.apellido = "Dewitt";
        //comstock.edad = 76;

        //comstock.afiliation = "vox populi"; //-> Si asignamos una característica así, se le pondrá tanto al proxy como al molde
        
        console.log(comstock);
        console.log(persona);

    </script>

    <h1>this</h1>
    <script>
        //La palabra this, es una palabra que hace referencia al objeto con el que estamos trabajando

        //En JavaScript se usa también para eso, pero también para diferentes contextos.

        console.log(this);
        console.log(window);
        console.log(this === window)

        this.nombre = "Contexto global"

        console.log(this.nombre)

        function imprimir(){
            console.log(this.nombre)
        }

        imprimir();



        const objeto = {
            nombre: "Contexto Objeto",
            imprimir: function (){
                console.log(this.nombre)
            }
        }

        objeto.imprimir();

        const obj2 = {
            nombre: "Contexto Objeto 2",
            imprimir
        }
        obj2.imprimir();
        //Dependiendo de función esta se adecúa al scope de donde se use


        const objeto3 = {
            nombre: "Contexto Objeto 3",
            imprimir: () =>{ //Las arrow function no manejan su propio scope, y agarra el scope de donde se encuentra colgada la función donde se usa
                console.log(this.nombre)
            }
        }
        objeto3.imprimir();

        function Persona(nombre){
            const that = this;
            that.nombre = nombre;
            //return console.log(this.nombre);
        
        
            return function (){
                console.log(that.nombre);
            }//En una clase de este tipo, al usar una función anónima no tiene un contexto, y al no tenerlo está tomando el del contexto global

            //Por lo tanto las arrow function si funcionan así:
            //return () => console.log(that.nombre)
        }

        let jon = new Persona("Jon");
        jon();
        //Podemos solucionar problemas a scope externo usando una variable que encapsule el contexto local: 




        //Los scopes en JavaScript son por documentos o por funciones al usar funciones anónimas, sin embargo si usamos una arrow function el scope de la función será el mismo que de donde se encuentra, es decir, no sufrirá de ningún ajuste

    </script>


    <h1>Call Aply Bind</h1>
    <script>
        console.log(this)
        this.lugar = "Contexto Global"

        function saludar(){
            console.log(`${this.lugar}`)
        }

        saludar();

        const obj = {
            lugar: "Contexto Objeto",

            //Vimos antes que solo usabamos la función saludar dentro de un objeto como este,   
            //Pero podemos evitarlo usando lo métodos call y apply, veamos

        }
        saludar.call(obj) //-> Con esto estamos llamando la función dentro de un nuevo contexto, que es el del objeto que pasemos como parámetro

        //Lo mismo con apply
        saludar.apply(obj);

        //Ahora, cual es la diferencia entre call y apply? Imaginemos que a la funcion queremos pasarle más parámetros

         function saludar2(saludo, aQuien){
            console.log(`${saludo}! ${aQuien} desde: ${this.lugar}`)
        }
        //Pues la diferencia es en como se reciben esos parámetros después del contexto con el que quiere trabajar:

        saludar2.call(obj, "Hola", "Dewitt") //Separacion por comas
        saludar2.apply(obj, ["Adios", "Commstock"])

        // Usar null en el espacio del objeto, es como volver al objeto global


        //MÉTODO BIND
        //Se trata de un método que realiza un enlace;

        this.nombre = "Ventana"

        const nuevaPersona = {
            nombre: "Zachary",
            saludar : function() {
                console.log(`Hola ${this.nombre}`)
            }
        }

        nuevaPersona.saludar();

        //Creemos otro objeto
        const otraPersona = {
            saludar: nuevaPersona.saludar.bind(this) //Referencia a la propiedad salidar //Aqui se le asigna el contexto de donde está
        }


        otraPersona.saludar();
    </script>
