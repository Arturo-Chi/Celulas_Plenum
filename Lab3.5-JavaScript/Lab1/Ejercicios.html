             function capicua(numero = undefined){
                try {
                    if(!numero) throw new Error("No hay parámetros");
                    if(isNaN(numero) || typeof numero !== "number") throw new Error("El parámetro debe de ser un número");
                    if(numero < 0) return false;
                    //if(numero-10 <0) return true;

                    
                    let og = numero, copia = 0;

                
                    while (og > 0) {
                        let digito = og%10;
                        
                        copia = (copia*10)+digito;
                        
                        og = Math.floor(og/10);
                        
                        //console.log(copia, numero);
                    }

                    return (numero === copia)? true: false;
                
                } catch (error) {
                    console.log(error)
                }
             }

             console.log(`capicua: ${capi}`);

        function factorial(numero = undefined){

            try {
                if(!numero) throw new Error("Parámetro no especificado");
                if(typeof numero !== "number" || isNaN(numero)) throw new Error("El parámetro no es un número");
                if(numero < 0) throw new Error("El número no es válido");

                let resultado = 1;
                for (let index = 1; index <= numero; index++) {
                    resultado *= index;
                }

                console.log(`El factorial de ${numero} : ${resultado}`);
            } catch (error) {
                console.log(error);                
            }

        }
        factorial(7);

        function esPrimo(numero = undefined){
            try {
                
                if(isNaN(numero) || typeof numero !== "number") throw new Error("El dato numérico no es válido");
                if(numero === 1) return false;

                if(numero === 2 || numero === 3) return true;
                if(numero%2 === 0) return false;

                    }
                }

            function convertirEscala(temperatura = undefined, escala = ""){
                try {
                    if(isNaN(temperatura) || typeof temperatura !== "number") throw new Error("La temperatura debe de ser un número");
                    if(!escala) throw new Error("Escala no especificada");

                    let unidad = escala.toLowerCase();
                    let conversion = temperatura;
                    switch (unidad) {
                        case "c":
                            
                            return `${conversion * 1.8 + 32}° F`
                            break;
                    
                        case "f":
                            
                            return `${(5/9)* conversion-32 }° C`;
                            break;

                        default:
                            throw new Error("Escala no válida");
                            break;
                    }
                } catch (error) {
                    console.error(error);
                } 
            }

            let nuevaTemp = convertirEscala(0,"C");
            console.log(nuevaTemp);

        const aDecimal = (valorBinario) =>{
            let valor = valorBinario;
            
            let comodin = 1;
            let resultado = 0;

            for (let index = valorBinario.toString().length-1; index >= 0; index--) {
                let digito = valor%10;
                resultado += digito*comodin;

                comodin*=2;
                valor = Math.floor(valor/10)
                
            }

            return `Binario: ${valorBinario} a Decimal: ${resultado}`;
        }

        const aBinario = (valorDecimal) =>{
            let numero = valorDecimal;
            let binario = "";
            while(numero > 0){
                
                digito = (numero%2 === 0) ? "0": "1";

                binario = digito + binario;
                numero = Math.floor(numero/2); 
                
            }
            return `Decimal: ${valorDecimal} a Binario: ${binario}`;
         
        }

        function contarVocalesConsonantes (str = ""){
            if(!str) return console.warn("No se ingresó el parámetro");
            if(typeof str !== "string") throw new Error("Parámetro inválido");

            let contVocales = 0;
            let contConsonantes = 0;

            let cadena = str.toLowerCase();
            const isVocal = (caracter)=>{
                return (caracter === 97 || caracter === 101 || caracter === 105 || caracter === 111 || caracter === 117)? true: false;
            }


            for (let index = 0; index < cadena.length; index++) {

                let item = cadena.charCodeAt(index);
                //console.log(`${cadena.charAt(index)} ==== ${item}`);
                (isVocal(item)) ? contVocales++: contConsonantes++;
                
            }

            return `Vocales = ${contVocales}, Consonantes = ${contConsonantes}`;
