<body>

    <article id="funciones">

        <h1>Funciones</h1>
        <p>Los datos compuestos incluyen a los siguientes:
            object {} 
            array []
            function ()
            Class{}
        </p>

        <p>Ordamiento de código: Importación de modulos, declaración de variables, declaración de funciones, ejecución del código</p>
        <script>
            //Primero veremos las funciones, son muy poderosas

            //Las funciones son objetos, pueden definirse una vez y ejecutarse en cualquier momento, opcionalmente puede recibir parámetros y devolver valores

            //CONCEPTOS BÁSICOS
// ------------------ Función declarada

            function funcionDeclarada(){
                console.log("Esto es una función declarada, puede invocarse en cualquier parte de nuestro código incluso antes de que la función sea declarada");
            }

            //Pero por qué?, pues JS lo que hace es ordenar las funciones primero y luego, la ejecuta




            function estoEsUnaFuncion(){
                //Son bloques de líneas de código
                
                console.log("Uno");
                console.log("Dos");
                console.log("Tres");

            }

                //Función que devuelve valor:

                function unaFuncionQueDevuelveValor(){
                    //Cuando una función devuelve un valor usamos: return
                    return "La función devuelve una String"

                    //Para que veamos si la función está realmente devilviendo el valor, puede usarse dentro de un console.log() o simplemente la asignamos a una variable

                    //El funcionamiento del return es que cuando el compilador encuentra la palabra, este sale del bloque de código.
                }


                //Función que recibe valores (parámetros):
                function saludar(nombre, edad){
                    console.log(`Hola mi nombre es ${nombre} y tengo ${edad} años`);

                }

                //Podemos poner datos por defecto
                 function saludar2(nombre="Desconocido", edad=0){
                    console.log(`Hola mi nombre es ${nombre} y tengo ${edad} años`);

                }

// ------------------ Funciones expresadas

            //Crea una función y la asigania deinámicamente a una variable, en estas debemos usar const
            //No le es necesario tener nombre (Función anónima)

            //También puede hacerse así const funcionExpresada = () => {}

            //Estas no pueden ser invocadas antes de su declaración funcionesExpresada();

            const funcionesExpresada = function (){
                console.log("Esto es una función EXPRESADA. Una función que se la sido asignada como valor a una variable, si invocamos esta función antes de su definción, JS nos dirá: ");
            }
            
            funcionesExpresada();


            //INVOCACIÓN DE FUNCIONES:
            estoEsUnaFuncion(); //-> Los paréntesis indican que una función se va a ejecutar
            
            let valorDeFuncion = unaFuncionQueDevuelveValor();
            console.log(valorDeFuncion);

            saludar("Arturo", 20);
            saludar2();


        </script>
    </article>

    <article id="arreglos">
        <h1>Arreglos</h1>
        <p>Se tratan del segundo tipo de dato compuesto</p>
        <script>
            //tenemos diferentes maneras de declarar arreglos:

            const a = [];
            const b = [1, true, "Hola", ["A", "B", "C"]];          

            console.log(a);
            console.log(b);
            console.log(b.length); //Para la longitud del arreglo
            console.log(b[2]);
            console.log(b[0]);
            console.log(b[3]);
            console.log(b[3][2]); //Accedemos al elemento del arreglo dentro del arreglo



            const c = Array.of("X", "y", "z", 1, 2, 3); //Otra forma de crear arreglos
            console.log(c);
    
            const d = Array(100).fill(false); //Crea un arreglo con 100 posiciones inicializadas con false
            console.log(d);

            //Antiguas formas de crear arreglos
            const e = new Array();
            console.log(e);

            const f = new Array(1, 2, 3, true, false);
            console.log(f);

            const colores = ["Rojo", "Azul", "Verde"];
            console.log(colores);

            colores.push("Negro"); //Agrega elemento al final
            console.log(colores);

            colores.pop(); //Quita el elemento final
            console.log(colores);



            //Método que permite ejecutar una función por cada elemento en el arreglo:
            colores.forEach(function (el, index){

                //el -> elemento que se está iterando en ese momento
                //index -> indice que tiene ese elemento
                
                console.log(`<li> ${index} ${el} </li>`);
                //También puede usar una arrow Function


            });
        </script>



    </article>
