    <h1>Numeros</h1>
    <script>
        //En JS solo tenemos la palabra number
        //Para conocer los atributos y métodos visitar, mozilla developer network

        let a = 2;
        let b = new Number(3);
        let c = 7.19;
        let d = "5.6";



        console.log(a+b);
        //Redondeo para números
        console.log(c.toFixed(1));


        //metodo parse int
        console.log(parseInt(c));
        console.log(typeof c, typeof d);
        console.log(a + b);


        // En este caso, si se suma un número con una cadena, el resultado es una cadena
        console.log(c + d);

        //Se puede convertir:
        console.log(c + parseInt(d));

        //TODOS ESTOS MÉTODOS USADOS CUELGAN DEL CONSTRUCTOR DE LOS NUMBER.
        //SI QUEREMOS SER MÁS ESPECÍFICOS, PODEMOS USAR: Number.método:

        console.log(c + Number.parseInt(d));
    </script>



    <h1>Booleanos</h1>

        //Podemos hacer booleanos con el propio constructor
        let t = Boolean(true);
